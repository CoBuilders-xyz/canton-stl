name: Library tests

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: stl-library-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Node ${{ matrix.node }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["24.10.0", "26.8.1"]
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare library reports
        run: mkdir -p .reports/library
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.dpm
          key: dpm-linux-x64-sdk-3.5.8-canton-3.5.6-v1
      - name: Install DPM, compiler, and Sandbox runtime
        run: |
          set -o pipefail
          bash scripts/install-ci-dpm.sh 2>&1 | tee .reports/library/toolchain.log
      - run: npm ci
      - name: Library typecheck and regression tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee .reports/library/unit.log
      - name: Installed JavaScript and TypeScript package consumers
        run: |
          set -o pipefail
          npm run test:package 2>&1 | tee .reports/library/package.log
      - name: Installed package on a real open Sandbox
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee .reports/library/integration.log
      - name: Library test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: library-tests-node-${{ matrix.node }}
          path: .reports/library/
          include-hidden-files: true
          if-no-files-found: warn
